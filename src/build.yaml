overview: "Semantic, natural-language search for your Jellyfin library"
description: >
  Bloom brings natural-language, meaning-aware search to Jellyfin. Ask for
  "80s horror but funny" or "movies like Heat" and get ranked results, backed
  by a search gateway with keyword + semantic fusion and reranking. Degrades
  cleanly to fast keyword search (Meilisearch) when the gateway is absent.
  Soft fork of the Meilisearch plugin by a.sac.
